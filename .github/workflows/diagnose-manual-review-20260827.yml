name: Diagnose current Manual Review clients

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-manual-review-20260827.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Railway deployment to settle
        run: sleep 90

      - name: Run isolated diagnostic-only queue
        env:
          BASE_URL: https://business-trappers-ai-credit-processor-production.up.railway.app
        run: |
          set -euo pipefail
          BODY='{"diagnosticOnly":true,"clientNames":["Kristina Tollon","Adriana Ellis-Fo"],"delayMs":1000,"maxClients":2}'
          echo "Starting diagnostic-only queue..."
          RESPONSE=$(curl -fsS -X POST "$BASE_URL/process-client-queue" \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "$RESPONSE"
          JOB_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["jobId"])')
          echo "Job ID: $JOB_ID"

          for i in $(seq 1 80); do
            sleep 15
            RESULT=$(curl -fsS "$BASE_URL/process-client-queue/$JOB_ID")
            STATUS=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            echo "Poll $i: $STATUS"
            if [ "$STATUS" = "complete" ] || [ "$STATUS" = "failed" ]; then
              echo '--- FINAL DIAGNOSTIC RESULT ---'
              printf '%s' "$RESULT" | python3 -m json.tool
              exit 0
            fi
          done

          echo "Diagnostic timed out before queue completion."
          exit 1
