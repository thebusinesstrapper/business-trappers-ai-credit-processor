name: Patch redundant Waiting for Bureau status writes

on:
  push:
    branches: [main]
    paths:
      - '.patch-triggers/waiting-route-fix.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded Waiting for Bureau patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/processProductionClient.js')
          s = p.read_text()

          old_sig = 'async function routeToWaitingForBureau(clientName, crcClientId, nowIso, nextFreeReportAt = null) {\n    const status = await statusOnlyUpdate({' 
          new_sig = '\n'.join([
              'async function routeToWaitingForBureau(',
              '    clientName,',
              '    crcClientId,',
              '    nowIso,',
              '    nextFreeReportAt = null,',
              '    observedCrcStatus = null',
              ') {',
              '    // If the nightly CRC grid already positively observed the client at the',
              '    // target status, do not reopen Edit Profile merely to write the same value.',
              '    // The grid observation is authoritative enough to prove no status change is',
              '    // needed, and skipping the modal avoids false Manual Review when a populated',
              '    // profile modal is slow or unavailable.',
              '    const observedNormalized =',
              '        typeof observedCrcStatus === "string"',
              '            ? observedCrcStatus.trim().replace(/\\s+/g, " ").toLowerCase()',
              '            : "";',
              '',
              '    if (observedNormalized === "waiting for bureau") {',
              '        const write = await recordCreditHeroState(String(crcClientId), {',
              '            block_reason: "WAITING_FOR_FREE_REPORT",',
              '            last_credit_hero_check_at: nowIso,',
              '            crc_client_status: observedCrcStatus.trim(),',
              '        }).catch(() => null);',
              '',
              '        return {',
              '            status: {',
              '                targetStatus: "Waiting For Bureau",',
              '                previousStatus: observedCrcStatus.trim(),',
              '                statusUpdated: false,',
              '                statusWritten: observedCrcStatus.trim(),',
              '                alreadyCorrect: true,',
              '                error_code: null,',
              '                failureReason: null,',
              '            },',
              '            memoryWritten: write?.ok === true,',
              '        };',
              '    }',
              '',
              '    const status = await statusOnlyUpdate({',
          ])

          if old_sig not in s:
              raise SystemExit('guard failed: routeToWaitingForBureau signature block not found')
          s = s.replace(old_sig, new_sig, 1)

          old_call_1 = '        const { status, memoryWritten } = await routeToWaitingForBureau(\n            clientName, routeCrcId, nowIso, capture?.nextFreeReportAvailableAt ?? null\n        );'
          new_call_1 = '        const { status, memoryWritten } = await routeToWaitingForBureau(\n            clientName,\n            routeCrcId,\n            nowIso,\n            capture?.nextFreeReportAvailableAt ?? null,\n            data.crcClientStatus ?? null\n        );'
          if old_call_1 not in s:
              raise SystemExit('guard failed: capture waiting-route call not found')
          s = s.replace(old_call_1, new_call_1, 1)

          old_call_2 = '        const { status, memoryWritten } = await routeToWaitingForBureau(\n            clientName, crcClientId, nowIso, successCapture?.nextFreeReportAvailableAt ?? null\n        );'
          new_call_2 = '        const { status, memoryWritten } = await routeToWaitingForBureau(\n            clientName,\n            crcClientId,\n            nowIso,\n            successCapture?.nextFreeReportAvailableAt ?? null,\n            data.crcClientStatus ?? null\n        );'
          if old_call_2 not in s:
              raise SystemExit('guard failed: eligibility waiting-route call not found')
          s = s.replace(old_call_2, new_call_2, 1)

          old_ok = '            ...base, ok: status.statusUpdated,\n            stage: "waiting_for_free_report",'
          new_ok = '            ...base, ok: status.statusUpdated === true || status.alreadyCorrect === true,\n            stage: "waiting_for_free_report",'
          count = s.count(old_ok)
          if count != 2:
              raise SystemExit(f'guard failed: expected 2 waiting-route ok expressions, found {count}')
          s = s.replace(old_ok, new_ok)

          p.write_text(s)
          PY

      - name: Validate patch
        run: |
          node --check src/processProductionClient.js
          grep -q 'observedNormalized === "waiting for bureau"' src/processProductionClient.js
          test "$(grep -c 'status.alreadyCorrect === true' src/processProductionClient.js)" -eq 2

      - name: Commit source patch
        run: |
          git config user.name "bt-waiting-route-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/processProductionClient.js
          git diff --cached --check
          git commit -m 'Skip redundant Waiting for Bureau status writes'
          git push origin HEAD:main
