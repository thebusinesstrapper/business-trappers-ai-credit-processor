name: Patch targeted retry safety

on:
  push:
    paths:
      - '.patch-triggers/targeted-retry-safety.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) A clean inactive-notice session must never reopen Edit Profile
          # merely to derive a greeting. The authoritative CRC list name is
          # already available and resolveFirstName() safely uses its first token.
          p = Path('src/inactiveWorkflow.js')
          s = p.read_text()
          old = '''        // Read the name live, at send time, from the clean notice session.\n        const profile = await readClientProfile(page, crcClientId).catch(() => null);\n        const firstName = resolveFirstName(profile?.identity, clientName);'''
          new = '''        // Keep the notice session CLEAN. Do not reopen Edit Profile just to\n        // derive the greeting: CRC already supplied the authoritative client\n        // display name, and resolveFirstName() safely falls back to its first token.\n        // This avoids recreating the exact stuck-profile overlay the fresh session\n        // was introduced to escape.\n        const firstName = resolveFirstName(null, clientName);'''
          if old not in s:
              raise SystemExit('guard failed: inactive notice profile-read block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Supplied-name jobs are intentionally targeted. They must not turn
          # into a global inactive recheck after the requested client finishes.
          q = Path('src/processClientQueue.js')
          t = q.read_text()
          old2 = '''        if (job.operationalRoutingApproved === true && job.diagnosticOnly !== true) {\n            try {\n                job.summary.inactiveRecheck = await runInactiveRecheckSweep({'''
          new2 = '''        if (\n            job.operationalRoutingApproved === true &&\n            job.diagnosticOnly !== true &&\n            job.clientNames.length === 0\n        ) {\n            try {\n                job.summary.inactiveRecheck = await runInactiveRecheckSweep({'''
          if old2 not in t:
              raise SystemExit('guard failed: inactive sweep gate not found')
          t = t.replace(old2, new2, 1)
          q.write_text(t)
          PY
      - name: Validate syntax
        run: |
          node --check src/inactiveWorkflow.js
          node --check src/processClientQueue.js
          node --check src/crcClientNotice.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No source diff'
            exit 0
          fi
          git config user.name actions
          git config user.email actions@github.com
          git add src/inactiveWorkflow.js src/processClientQueue.js
          git commit -m 'Keep targeted retries isolated and notice sessions clean'
          git push origin main
