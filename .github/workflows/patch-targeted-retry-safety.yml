name: Patch CRC client-name matching

on:
  push:
    branches:
      - main
    paths:
      - '.patch-triggers/waiting-route-fix.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/patch_client_name_column.py
      - name: Validate source
        run: node --check src/openClient.js
      - name: Commit source patch
        run: |
          git config user.name "bt-client-name-match-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/openClient.js
          git diff --cached --check
          git commit -m "Match CRC clients by client-name link, not team-member text"
          git push origin HEAD:main
