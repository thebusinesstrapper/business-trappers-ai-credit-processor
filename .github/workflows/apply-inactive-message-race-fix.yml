name: One-time inactive message race fix

on:
  push:
    paths:
      - '.github/workflows/apply-inactive-message-race-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python .github/scripts/patch_inactive_message_race.py
      - name: Syntax checks
        run: |
          node --check src/inactiveWorkflow.js
          node --check src/processProductionClient.js
          node --check src/inactiveRecheckSweep.js
          node --check src/inactiveMessageGate.js
      - name: Focused race tests
        run: node src/inactiveMessageGate.test.js
      - name: Commit production fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-inactive-message-race-fix.yml
          git config user.name 'thebusinesstrapper'
          git config user.email 'thebusinesstrapper@gmail.com'
          git add src/inactiveWorkflow.js src/processProductionClient.js src/inactiveRecheckSweep.js src/inactiveMessageGate.js src/inactiveMessageGate.test.js .github/workflows/apply-inactive-message-race-fix.yml
          git diff --cached --quiet && exit 1
          git commit -m 'Suppress stale inactive notices after reactivation'
          git push
