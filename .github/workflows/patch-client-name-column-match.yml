name: Patch processing audit history

on:
  push:
    branches: [main]
    paths:
      - '.patch-triggers/client-name-column-match.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 .github/scripts/patch_processing_audit.py

      - name: Validate patch
        run: |
          node --check src/processingRunHistory.js
          node --check src/processProductionClient.js
          grep -q 'recordSuccessfulProcessingRun' src/processProductionClient.js
          grep -q 'processingRunAudit' src/processProductionClient.js
          grep -q 'lifecycleSucceeded' src/processProductionClient.js

      - name: Commit source patch
        run: |
          git config user.name "bt-processing-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/processProductionClient.js
          git diff --cached --check
          git commit -m 'Persist successful processing run history'
          git push origin HEAD:main
