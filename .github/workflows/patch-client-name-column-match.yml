name: One-time cleanup obsolete GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - '.patch-triggers/client-name-column-match.txt'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete one-time workflow files
        run: |
          rm -f .github/workflows/*.yml
          rm -f .github/workflows/*.yaml

      - name: Commit cleanup
        run: |
          git config user.name "bt-actions-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "Remove obsolete one-time GitHub Actions workflows"
          git push origin HEAD:main
