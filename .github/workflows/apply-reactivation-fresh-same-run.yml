name: Apply reactivation fresh-report same-run fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_reactivation_fresh_same_run.py'
      - '.github/trigger-reactivation-fresh-same-run'

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_reactivation_fresh_same_run.py
      - name: Syntax checks
        run: |
          node --check src/clientMemory.js
          node --check src/inactiveRecheckSweep.js
          node --check src/inactiveRecheckDecision.js
          node --check src/inactiveRecheckDecision.test.js
      - name: Focused tests
        run: |
          node src/inactiveRecheckDecision.test.js
          node src/reportFreshness.test.js
      - name: Commit source patch
        run: |
          git config user.name "bt-reactivation-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clientMemory.js src/inactiveRecheckSweep.js src/inactiveRecheckDecision.js src/inactiveRecheckDecision.test.js
          git diff --cached --check
          git commit -m "Process reactivated clients when fresh report exists"
          git push origin HEAD:main
