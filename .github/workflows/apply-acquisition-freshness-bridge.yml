name: Apply acquisition freshness bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_acquisition_freshness_bridge.py'
      - '.github/trigger-acquisition-freshness-bridge'

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_acquisition_freshness_bridge.py
      - name: Syntax checks
        run: |
          node --check src/reportFreshness.js
          node --check src/milestone6.js
          node --check src/reportFreshness.test.js
      - name: Focused tests
        run: |
          node src/reportFreshness.test.js
          if [ -f src/acquireCurrentReport.test.js ]; then node src/acquireCurrentReport.test.js; fi
          if [ -f src/milestone6.test.js ]; then node src/milestone6.test.js; fi
      - name: Commit source patch
        run: |
          git config user.name "bt-acquisition-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/reportFreshness.js src/milestone6.js src/reportFreshness.test.js
          git diff --cached --check
          git commit -m "Route stale later rounds through free report acquisition"
          git push origin HEAD:main
