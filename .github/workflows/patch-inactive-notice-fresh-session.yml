name: Patch inactive notice fresh session

on:
  push:
    paths:
      - '.patch-triggers/inactive-notice-fresh-session.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/inactiveWorkflow.js')
          s = p.read_text()

          old_open = '        await openClient(page, clientName);\n\n        const openedId = String(await getCrcClientId(page));'
          new_open = '''        // Use the authoritative CRC id already supplied by the inactive route.\n        // Name remains the search text, but the id selects the exact client row.\n        await openClient(page, clientName, crcClientId);\n\n        const openedId = String(await getCrcClientId(page));'''
          if old_open not in s:
              raise SystemExit('guard failed: initial openClient block not found')
          s = s.replace(old_open, new_open, 1)

          marker = '''    if (decision.action !== PLANNED_ACTION.NO_MESSAGE_DUE) {\n        const isReminder = decision.action === PLANNED_ACTION.SEND_REMINDER;\n\n        // Read the name live, at send time.\n        const profile = await readClientProfile(page, crcClientId).catch(() => null);'''
          replacement = '''    if (decision.action !== PLANNED_ACTION.NO_MESSAGE_DUE) {\n        const isReminder = decision.action === PLANNED_ACTION.SEND_REMINDER;\n\n        // NOTICE SESSION ISOLATION. The status writer opens CRC's Edit Profile\n        // modal. If CRC stalls while populating that modal, the page can remain\n        // covered by a stale overlay even though the status result has already\n        // been captured. Reusing that page for \"Send Secure Message\" makes the\n        // composer click land behind the modal and every compose field reads\n        // false. A notice is independent of the status write, so start it from a\n        // fresh CRC session and the exact authoritative client id.\n        try {\n            if (browser) await browser.close();\n        } catch { /* best effort */ }\n        browser = null;\n        page = null;\n\n        try {\n            const noticeSession = await launchBrowser();\n            browser = noticeSession.browser;\n            page = noticeSession.page;\n\n            await loginToCRC(page);\n            await openClient(page, clientName, crcClientId);\n\n            const noticeOpenedId = String(await getCrcClientId(page));\n            if (noticeOpenedId !== String(crcClientId)) {\n                report.error_code = report.error_code ?? \"NOTICE_WRONG_CLIENT_OPENED\";\n                report.failureReason = report.failureReason ??\n                    `Notice session opened client ${noticeOpenedId}, expected ${crcClientId}. Notice not sent.`;\n                await recordCreditHeroState(crcClientId, {\n                    inactive_notice_last_error: \"notice_session: wrong_client_opened\",\n                }).catch(() => {});\n                return report;\n            }\n        } catch (error) {\n            report.error_code = report.error_code ?? \"NOTICE_SESSION_FAILED\";\n            report.failureReason = report.failureReason ??\n                `Could not open a fresh CRC session for the inactive notice: ${error.message}`;\n            await recordCreditHeroState(crcClientId, {\n                inactive_notice_last_error: `notice_session: ${String(error.message ?? error).slice(0, 180)}`,\n            }).catch(() => {});\n            return report;\n        }\n\n        // Read the name live, at send time, from the clean notice session.\n        const profile = await readClientProfile(page, crcClientId).catch(() => null);'''
          if marker not in s:
              raise SystemExit('guard failed: notice block marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check src/inactiveWorkflow.js
          node --check src/crcClientNotice.js
          node --check src/openClient.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No diff to commit'
            exit 0
          fi
          git config user.name actions
          git config user.email actions@github.com
          git add src/inactiveWorkflow.js
          git commit -m 'Isolate inactive notices in fresh CRC sessions'
          git push origin main
