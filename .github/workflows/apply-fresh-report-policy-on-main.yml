name: Apply fresh report policy on main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-main:
    if: github.event.head_commit.message != 'Use fresh report availability as next-round gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_fresh_report_policy_fix.py
      - name: Syntax and focused tests
        run: |
          node --check src/processProductionClient.js
          node --check src/clientMemory.js
          node --check src/inactiveRecheckSweep.js
          node --check src/inactiveRecheckDecision.js
          node src/reportFreshness.test.js
          if [ -f src/inactiveRecheckDecision.test.js ]; then node src/inactiveRecheckDecision.test.js; fi
      - name: Commit tested patch
        run: |
          git config user.name "bt-policy-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/processProductionClient.js src/clientMemory.js src/inactiveRecheckSweep.js src/inactiveRecheckDecision.js
          git diff --cached --check
          git commit -m "Use fresh report availability as next-round gate"
          git push origin HEAD:main
