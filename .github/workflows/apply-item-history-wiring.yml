name: One-time item history wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-item-history-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded wiring patch
        run: python3 .github/scripts/patch_item_history_wiring.py
      - name: Validate syntax and focused strategy tests
        run: |
          node --check src/itemDisputeHistory.js
          node --check src/pipeline.js
          node --check src/milestone7.js
          node --check src/processProductionClient.js
          node src/selectStrategy.test.js
          if [ -f src/baselineDispute.test.js ]; then node src/baselineDispute.test.js; fi
      - name: Commit tested production patch and remove one-time workflow
        run: |
          git config user.name "bt-item-history-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/itemDisputeHistory.js src/pipeline.js src/milestone7.js src/processProductionClient.js
          git rm .github/workflows/apply-item-history-wiring.yml
          git diff --cached --check
          git commit -m "Persist and consume per-item dispute history"
          git push origin HEAD:main
