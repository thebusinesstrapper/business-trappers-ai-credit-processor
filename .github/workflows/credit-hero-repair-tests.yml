name: Credit Hero repair regression tests
on:
  push:
    branches:
      - fix/credit-hero-dom-recovery-20261116
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/captureReportedAddresses.test.js
