name: Exclude suspended from inactive sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-exclude-suspended-inactive-sweep'

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/exclude_suspended_from_inactive_sweep.py
      - name: Syntax check
        run: node --check src/inactiveRecheckSweep.js
      - name: Verify exclusions
        shell: bash
        run: |
          grep -q 'key(row.crc_client_status) === "suspended"' src/inactiveRecheckSweep.js
          grep -q 'row.process_complete === true' src/inactiveRecheckSweep.js
      - name: Commit source patch
        run: |
          git config user.name "bt-safety-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/inactiveRecheckSweep.js
          git diff --cached --check
          git commit -m "Exclude suspended clients from inactive recheck sweep"
          git push origin HEAD:main
