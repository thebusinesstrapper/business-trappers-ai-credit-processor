name: Retry Patience inactive notice

on:
  push:
    paths:
      - '.patch-triggers/retry-patience-inactive-notice.txt'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          BASE='https://business-trappers-ai-credit-processor-production.up.railway.app'
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/" >/dev/null; then
              echo "Production is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become reachable."
          exit 1
      - name: Start Patience-only production job
        id: start
        run: |
          set -euo pipefail
          BASE='https://business-trappers-ai-credit-processor-production.up.railway.app'
          BODY='{"processingApproved":true,"submitApproved":true,"operationalRoutingApproved":true,"inactiveWorkflowApproved":true,"clientNames":["PATIENCE Shelby"],"maxClients":1,"delayMs":0}'
          RESP=$(curl -fsS -X POST "$BASE/process-client-queue" -H 'Content-Type: application/json' --data "$BODY")
          echo "$RESP"
          JOB_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||!x.jobId) process.exit(2); process.stdout.write(x.jobId)' "$RESP")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
      - name: Poll Patience-only job
        run: |
          set -euo pipefail
          BASE='https://business-trappers-ai-credit-processor-production.up.railway.app'
          JOB='${{ steps.start.outputs.job_id }}'
          for i in $(seq 1 120); do
            RESP=$(curl -fsS "$BASE/process-client-queue/$JOB")
            STATUS=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.status||""))' "$RESP")
            echo "poll $i: $STATUS"
            if [ "$STATUS" = "complete" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "stopped_system_failure" ]; then
              node -e 'const x=JSON.parse(process.argv[1]); console.log(JSON.stringify({jobId:x.jobId,status:x.status,summary:x.summary,results:(x.results||[]).map(r=>({clientName:r.clientName,crcClientId:r.crcClientId,status:r.status,stage:r.stage,classification:r.classification,blockedReason:r.blockedReason,ok:r.ok,inactive:r.inactive?{noticeSent:r.inactive.noticeSent,reminderSent:r.inactive.reminderSent,statusUpdated:r.inactive.statusUpdated,error_code:r.inactive.error_code,failureReason:r.inactive.failureReason}:null}))},null,2))' "$RESP"
              [ "$STATUS" = "complete" ] && exit 0 || exit 1
            fi
            sleep 5
          done
          echo "Timed out polling Patience-only job."
          exit 1
